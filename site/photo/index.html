<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>masnun.photos</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <h1><a href="/">masnun<span>.photos</span></a></h1>
  </header>
  <main>
    <div id="photo-view">Loading…</div>
  </main>
  <script src="/assets/js/app.js"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(location.search).get('id');
      const m = await loadManifest();
      const p = m.photos.find(x => x.id === id);
      if (!p) { document.querySelector('#photo-view').textContent = 'Not found'; return; }
      renderPhoto('#photo-view', p, m);
    })();
  </script>
</body>
</html>
