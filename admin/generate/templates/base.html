{{define "base"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{template "title" .}}</title>
  {{with .SEO}}
  <meta name="description" content="{{.Description}}">
  <link rel="canonical" href="{{.BaseURL}}{{.Path}}">
  <meta property="og:url" content="{{.BaseURL}}{{.Path}}">
  <meta property="og:site_name" content="{{.SiteName}}">
  <meta property="og:locale" content="{{.Locale}}">
  <meta name="twitter:card" content="summary_large_image">
  {{with .Description}}<meta name="twitter:description" content="{{.}}">{{end}}
  {{with .ImageURL}}<meta property="og:image" content="{{.}}">
  <meta name="twitter:image" content="{{.}}">{{end}}
  {{end}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600;700&family=Lato:wght@300;400;700&family=Odibee+Sans&display=swap">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#111111">
  <link rel="stylesheet" href="/assets/css/style.css">
  {{template "head" .}}
</head>
<body>
  <header class="site-header">
    <h1><a href="/">masnun<span>.photos</span></a></h1>
    <nav>
      <a href="/">Home</a>
      <a href="/collection/">Collections</a>
      <a href="/calendar/">Calendar</a>
    </nav>
  </header>
  <main>
    {{template "content" .}}
  </main>
  <footer>masnun.photos</footer>
</body>
</html>
{{end}}
