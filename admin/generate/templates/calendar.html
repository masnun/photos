{{define "title"}}{{.Month.Label}} · masnun.photos{{end}}
{{define "head"}}<meta property="og:title" content="{{.Month.Label}} · masnun.photos">
  <meta property="og:type" content="website">{{end}}
{{define "content"}}
<h2>{{.Month.Label}}</h2>
<p class="lede">{{.Month.Count}}টি ছবি</p>
<div class="gallery">
  {{if not .Photos}}<p class="empty">কোনো ছবি নেই।</p>{{end}}
  {{range .Photos}}
  <a class="gallery-item" href="/calendar/{{$.Month.Slug}}/photo/{{.ID}}/">
    <div class="gallery-img"><img src="{{.URLs.Web}}" alt="" loading="lazy"></div>
  </a>
  {{end}}
</div>
{{end}}
{{template "base" .}}
