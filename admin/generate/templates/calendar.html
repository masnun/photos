{{define "title"}}{{.Month.Label}} · masnun.photos{{end}}
{{define "head"}}<meta property="og:title" content="{{.Month.Label}} · masnun.photos">
  <meta property="og:type" content="website">
  {{with .Cover}}<meta property="og:image" content="{{.URLs.Web}}">{{end}}{{end}}
{{define "content"}}
<h2>{{.Month.Label}}</h2>
<p class="lede">{{.Month.Count}} photo{{if ne .Month.Count 1}}s{{end}}</p>
<div class="gallery">
  {{if not .Photos}}<p class="empty">No photos.</p>{{end}}
  {{range .Photos}}
  <a class="gallery-item" href="/photo/{{.ID}}/">
    <img src="{{.URLs.Thumb}}" alt="{{.Caption}}" loading="lazy">
  </a>
  {{end}}
</div>
{{end}}
{{template "base" .}}
