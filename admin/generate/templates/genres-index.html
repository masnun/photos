{{define "title"}}জনরা · masnun.photos{{end}}
{{define "head"}}<meta property="og:title" content="জনরা · masnun.photos">
  <meta property="og:type" content="website">{{end}}
{{define "content"}}
<section id="genres-section">
  <h2>জনরা</h2>
  <div class="tile-grid">
    {{if not .Genres}}<p class="empty">এখনো কিছু নেই।</p>{{end}}
    {{range .Genres}}
    <a class="tile tile-title-top" href="/genre/{{.Slug}}/">
      <div class="tile-label"><strong>{{.Name}}</strong>{{with .Description}}<span>{{. | markdownInline}}</span>{{end}}</div>
      <div class="tile-img-wrap">{{with .Cover}}<img src="{{.URLs.Web}}" alt="" loading="lazy">{{else}}<div class="tile-empty"></div>{{end}}</div>
    </a>
    {{end}}
  </div>
</section>
{{end}}
{{template "base" .}}
